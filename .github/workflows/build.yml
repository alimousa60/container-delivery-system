name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build Backend -c Release

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: Frontend/container-delivery-frontend
      - run: npx tsc --noEmit
        working-directory: Frontend/container-delivery-frontend
      - run: npm run build
        working-directory: Frontend/container-delivery-frontend

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/src/ContainerDelivery.Api/Dockerfile
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: ./Frontend/container-delivery-frontend
          push: false
